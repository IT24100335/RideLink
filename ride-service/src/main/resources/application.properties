server.port=8083
spring.application.name=ride-service

# MS SQL Server Persistence Boundary: ride_db
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=ride_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:Password123!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Interservice Communication URLs
services.driver-service.url=http://${DRIVER_SERVICE_HOST:localhost}:${DRIVER_SERVICE_PORT:8082}
services.fare-service.url=http://${FARE_SERVICE_HOST:localhost}:${FARE_SERVICE_PORT:8084}

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
