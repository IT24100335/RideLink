server.port=0
spring.application.name=ride-service-test

spring.datasource.url=jdbc:h2:mem:ride_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

services.driver-service.url=http://localhost:8082
services.fare-service.url=http://localhost:8084
